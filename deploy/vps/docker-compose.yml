services:
  server:
    build:
      context: ../../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: file:/data/worksmart.db
    volumes:
      - worksmart_data:/data
    expose:
      - "4000"
    networks:
      gateway:
        aliases:
          - worksmart-server
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/users',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  client:
    build:
      context: ../../client
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      gateway:
        aliases:
          - worksmart-client
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  worksmart_data:
    name: worksmart_data

networks:
  gateway:
    name: worksmart_gateway
    external: true
