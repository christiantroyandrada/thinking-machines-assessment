services:
  - type: web
    name: worksmart-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worksmart-db
          property: connectionString
databases:
  - name: worksmart-db
    plan: free
